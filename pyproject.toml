[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-server"
version = "0.1.0"
description = "A minimal local music server inspired by Mopidy"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["mutagen>=1.47.0", "sounddevice>=0.5.0", "soundfile>=0.14.0","PyGObject>=3.56.0",]

[project.scripts]
music-server = "music_server.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
